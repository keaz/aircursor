name: AirCursor

options:
  bundleIdPrefix: com.kasunranasinghe
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  HandTrackingKit:
    path: Packages/HandTrackingKit
  MotionFilters:
    path: Packages/MotionFilters
  GestureEngine:
    path: Packages/GestureEngine
  PointerControl:
    path: Packages/PointerControl
  QuartzOutput:
    path: Packages/QuartzOutput

targets:
  AirCursor:
    type: application
    platform: macOS
    sources:
      - App/Sources
    dependencies:
      - package: HandTrackingKit
        product: HandPoseCore
      - package: HandTrackingKit
        product: HandTrackingKit
      - package: MotionFilters
      - package: GestureEngine
      - package: PointerControl
      - package: QuartzOutput
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kasunranasinghe.AirCursor
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Pinned to the local Apple Development identity: TCC permission
        # grants (camera, accessibility) are keyed to the code-signing
        # requirement, so an unstable identity silently invalidates them on
        # every rebuild.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: GVD3N5A668
